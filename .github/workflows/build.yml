name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Ensure an NDK is available
        run: |
          set -euo pipefail
          echo "NDKs present:"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "  none"
          if [ ! -d "$ANDROID_HOME/ndk" ] || [ -z "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            echo "installing one"
            SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
            yes | "$SDKM" --install "ndk;27.0.12077973" > /dev/null
            ls "$ANDROID_HOME/ndk"
          fi

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name "*.apk" -print -quit)
          test -n "$APK" || { echo "::error::no APK produced"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Merged manifest check
        run: |
          set -euo pipefail
          M=$(find app/build/intermediates -name AndroidManifest.xml -path "*merged*" | head -1)
          echo "merged manifest: $M"
          echo "--- hosted activity in the merged manifest:"
          grep -n "com.mojang.minecraftpe.MainActivity" "$M" || echo "NOT PRESENT"
          echo "--- package:"
          grep -o 'package="[^"]*"' "$M" | head -1
          if ! grep -q "com.mojang.minecraftpe.MainActivity" "$M"; then
            echo "::error::the hosted activity is missing from the merged manifest"
            exit 1
          fi

      - name: Signing certificate
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee signing.txt
          echo "::notice::APK signed with the certificate above"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vela-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
